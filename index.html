<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李太阳 ☀ 语音厅工具站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#0d0d12; --gold:#d9a83e; --gold2:#f6cf72;
    --txt:#f0f0f5; --sub:#8b8b9c; --mute:#5a5a6b;
    --green:#23a55e; --green2:#2dbe72;
  }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--txt); overflow:hidden;
    font-family:"Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
  }

  /* 背后那团太阳光 */
  .sun{
    position:fixed; left:50%; top:44%; width:1000px; height:1000px;
    margin-left:-500px; margin-top:-500px; pointer-events:none; z-index:0;
    background:radial-gradient(circle, rgba(217,168,62,.20) 0%, rgba(217,168,62,.09) 28%, rgba(217,168,62,0) 62%);
    animation:breathe 7s ease-in-out infinite;
  }
  .sun::after{
    content:""; position:absolute; left:50%; top:50%; width:340px; height:340px;
    margin-left:-170px; margin-top:-170px; border-radius:50%;
    background:radial-gradient(circle, rgba(246,207,114,.18), rgba(246,207,114,0) 70%);
    filter:blur(6px);
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:.85; }
    50%    { transform:scale(1.09); opacity:1; }
  }

  /* 细网格，衬科技感 */
  .grid{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(circle at 50% 42%, #000 12%, transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 12%, transparent 72%);
  }

  .stage{
    position:relative; z-index:1; text-align:center;
    padding:24px; max-width:760px;
    animation:rise .9s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(22px); }
    to  { opacity:1; transform:none; }
  }

  .badge{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:.22em; color:var(--mute);
    border:1px solid #26262f; border-radius:999px;
    padding:7px 16px; margin-bottom:34px;
  }
  .badge i{ width:6px; height:6px; border-radius:50%; background:var(--gold); display:block; }

  /* 头像：金色描边 + 外发光 */
  .ava{
    width:132px; height:132px; margin:0 auto 26px; position:relative;
    border-radius:50%; padding:3px;
    background:linear-gradient(145deg, var(--gold2), rgba(217,168,62,.18) 55%, rgba(255,255,255,.12));
    box-shadow:0 0 46px rgba(217,168,62,.3), 0 12px 30px rgba(0,0,0,.55);
    animation:halo 6s ease-in-out infinite;
  }
  .ava img{
    width:100%; height:100%; border-radius:50%; object-fit:cover;
    display:block; background:#1a1a22;
  }
  @keyframes halo{
    0%,100%{ box-shadow:0 0 40px rgba(217,168,62,.24), 0 12px 30px rgba(0,0,0,.55); }
    50%    { box-shadow:0 0 62px rgba(246,207,114,.42), 0 12px 30px rgba(0,0,0,.55); }
  }

  h1{
    font-size:clamp(54px, 11vw, 104px); font-weight:800;
    letter-spacing:-3px; line-height:1.02; margin-bottom:14px;
    background:linear-gradient(135deg,#fff 8%, var(--gold2) 46%, var(--gold) 78%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1 .sunmark{
    font-size:.56em; vertical-align:.16em; margin-left:.1em;
    -webkit-text-fill-color:var(--gold2);
  }

  .tagline{
    font-size:clamp(15px,2.1vw,19px); color:#c9c9d6; margin-bottom:38px;
    letter-spacing:.4px;
  }
  .tagline b{ color:var(--gold2); font-weight:600; }

  .creed{
    list-style:none;
    display:flex; flex-direction:column; gap:13px;
    text-align:left; margin:0 auto 42px; width:fit-content;
  }
  .creed li{
    font-size:14.5px; color:var(--sub); line-height:1.7;
    padding-left:16px; position:relative;
  }
  .creed li::before{
    content:""; position:absolute; left:0; top:9px;
    width:2px; height:13px; border-radius:2px; background:#3a3a48;
  }
  .creed b{
    color:var(--gold2); font-weight:700;
    display:inline-block; min-width:92px; margin-right:8px;
  }

  .enter{
    display:inline-flex; align-items:center; justify-content:center; gap:11px;
    height:58px; padding:0 44px; border-radius:999px;
    text-decoration:none; font-size:16px; font-weight:700; letter-spacing:.14em;
    color:#12120f; background:linear-gradient(135deg,var(--gold2),var(--gold));
    box-shadow:0 10px 34px rgba(217,168,62,.26), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
  }
  .enter:hover{
    transform:translateY(-2px); filter:brightness(1.06);
    box-shadow:0 16px 42px rgba(217,168,62,.4), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .enter:active{ transform:translateY(0); }
  .enter svg{ width:18px; height:18px; }

  .foot{
    margin-top:26px; font-size:12.5px; color:var(--mute); letter-spacing:.05em;
  }
  .foot span{ color:#3d3d49; margin:0 7px; }

  .skip{
    position:fixed; top:22px; right:26px; z-index:3;
    font-size:12px; color:#4e4e5c; text-decoration:none;
    border-bottom:1px solid transparent; transition:color .18s, border-color .18s;
  }
  .skip:hover{ color:var(--sub); border-bottom-color:#3a3a46; }

  @media (max-width:560px){
    h1{ letter-spacing:-1.5px; }
    .enter{ height:52px; padding:0 32px; font-size:15px; }
    .creed li{ font-size:13.5px; }
  }
  @media (prefers-reduced-motion: reduce){
    .sun, .stage{ animation:none; }
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="grid"></div>

<div class="stage">
  <div class="ava"><img src="avatar.jpg?v=3" alt="李太阳"></div>
  <div class="badge"><i></i>语音厅 · 主播自用工具</div>

  <h1>李太阳<span class="sunmark">☀</span></h1>
  <p class="tagline">在语音厅，我<b>不用手干活</b>，我用工具干活</p>

  <ul class="creed">
    <li><b>AI写作业</b>AI帮写，一晚上几百条私信，条条不重样</li>
    <li><b>内置爆灯</b>内置到开播助手，不影响打字，鼠标键盘都是你的</li>
    <li><b>欢迎机器人</b>人一进来就欢迎，礼物一到就感谢，情绪价值拉满</li>
  </ul>

  <a class="enter" href="download.html">
    进 去 看 看
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
  </a>

  <p class="foot">三个工具，一个人写的<span>·</span>自己直播天天在用</p>
</div>

</body>
</html>
